name: media-worker
on:
  schedule: [{ cron: "*/5 * * * *" }]
  workflow_dispatch:
    inputs:
      mode: { description: "worker | selftest | lyrics-selftest | looks-selftest | reframe-selftest | perf-selftest", default: "worker", required: false }
concurrency: { group: media-worker, cancel-in-progress: false }
permissions: { contents: read, actions: read }
jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar secretos
        id: gate
        env: { S: "${{ secrets.SUPABASE_SECRET_KEY }}", D: "${{ secrets.DEEPGRAM_API_KEY }}", G: "${{ secrets.GROQ_API_KEY }}" }
        run: |
          # Imprescindible: Supabase y al menos un proveedor de transcripción (Deepgram o Groq). Anthropic es opcional: sin él la selección es léxica y etiquetada.
          if [ -z "$S" ] || { [ -z "$D" ] && [ -z "$G" ]; }; then echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::Faltan secretos (SUPABASE_SECRET_KEY y DEEPGRAM_API_KEY o GROQ_API_KEY): el worker no procesa."; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.ready == 'true'
        timeout-minutes: 10
        env:
          FF_TAG: autobuild-2026-11-10-12-39
          FF_FILE: ffmpeg-n9.0.2-48-gd4070a14ce-linux64-gpl-9.0.tar.xz
          FF_SHA256: 8206a48ce342b5075d0e0293e468a61198a55b3ef479bec3f7e83b04a18667d4
        run: |
          # `apt-get update` no responde desde los runners (2026-11-11: >1 h; probado en ubuntu-22.04 y 24.04 y con otros espejos).
          # ffmpeg 9.0.2 (la versión con la que se prueba en local) se descarga fijado a una versión de BtbN/FFmpeg-Builds, se verifica su
          # SHA-256 antes de usarlo y se instala en el directorio del usuario (sin sudo).
          mkdir -p "$HOME/ffbin" /tmp/ffdl
          curl -fsSL --retry 4 --retry-delay 3 --max-time 420 -o "/tmp/ffdl/$FF_FILE" "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FF_TAG/$FF_FILE"
          echo "$FF_SHA256  /tmp/ffdl/$FF_FILE" | sha256sum -c -
          tar -xJf "/tmp/ffdl/$FF_FILE" -C /tmp/ffdl --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          install -m 755 /tmp/ffdl/ffmpeg /tmp/ffdl/ffprobe "$HOME/ffbin/"
          echo "$HOME/ffbin" >> "$GITHUB_PATH"; export PATH="$HOME/ffbin:$PATH"
          ffmpeg -hide_banner -version | head -1
          ffprobe -version | head -1
          ffmpeg -hide_banner -filters | grep -E " (subtitles|ass) " | head -2
          ffmpeg -hide_banner -encoders | grep -E " libx264 | aac " | head -2
      - if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          # Solo las autopruebas usan espeak-ng y las fuentes Liberation: intento opcional, sin bloquear el procesador.
          sudo timeout 60 apt-get -o Acquire::http::Timeout=15 update -qq && sudo timeout 90 apt-get install -y -qq fonts-liberation espeak-ng || echo "::notice::apt no disponible: se omiten espeak-ng y Liberation (solo autopruebas)"
      - if: steps.gate.outputs.ready == 'true'
        run: python3 -m pip install --quiet --break-system-packages "opencv-python-headless==4.10.0.84" "numpy<2.1" && python3 -c "import cv2; print('opencv', cv2.__version__)"   # reencuadre automático (detección de caras)
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 24 }
      - if: steps.gate.outputs.ready == 'true'
        run: corepack enable && corepack prepare pnpm@12.18.0 --activate && pnpm install --frozen-lockfile
      - if: steps.gate.outputs.ready == 'true'
        working-directory: workers/media
        env:
          SUPABASE_URL: https://attrnwbcgascvppncucl.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}      # Cloudflare R2 para originales (opcional; sin él, Supabase Storage)
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}        # opcional: sin clave se usa Deepgram/Anthropic como hasta ahora
          ASR_PROVIDER: ${{ vars.ASR_PROVIDER }}           # deepgram (por defecto) | groq
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}           # anthropic | groq
          GROQ_STT_MODEL: ${{ vars.GROQ_STT_MODEL }}
          GROQ_EDITORIAL_MODEL: ${{ vars.GROQ_EDITORIAL_MODEL }}
          GROQ_VISION_MODEL: ${{ vars.GROQ_VISION_MODEL }}
          PERF_CONC: "1,2"
          WORKER_IDLE_SECONDS: "600"   # caliente 10 min tras el último trabajo: los siguientes arrancan en segundos
          WORKER_MAX_SECONDS: "3000"
        run: node src/${{ (inputs.mode == 'selftest' || inputs.mode == 'lyrics-selftest' || inputs.mode == 'looks-selftest' || inputs.mode == 'reframe-selftest' || inputs.mode == 'perf-selftest') && inputs.mode || 'run' }}.ts
      - if: steps.gate.outputs.ready == 'true' && inputs.mode == 'looks-selftest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: looks-selftest
          path: |
            workers/media/looks-out/*.mp4
            workers/media/looks-out/*.png
            workers/media/looks-out/*.ass
            workers/media/looks-out/report.json
          retention-days: 14
